name: CI — LiquidaYA

on: [push, pull_request]

jobs:
  tests:
    name: 🧪 Tests CST
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Instalar dependencias
        run: pip install streamlit pandas pytest

      - name: 📁 Verificar estructura (debug)
        run: find . -name "test_*.py" | sort

      - name: 🧪 Correr tests
        run: python -m pytest -v --tb=short