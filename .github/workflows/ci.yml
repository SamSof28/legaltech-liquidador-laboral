name: CI — LiquidaYA Quality Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ────────────────────────────────────────────────────────────────
  # JOB 1: Tests del motor de cálculo CST
  # ────────────────────────────────────────────────────────────────
  test-motor-cst:
    name: 🧮 Tests Motor CST
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.14.5"]

    steps:
      - name: 📥 Checkout del código
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 📦 Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: 🧪 Ejecutar suite completa de pruebas
        run: |
          pytest test/ -v \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml \
            --tb=short

      - name: 📊 Subir reporte de cobertura
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  # ────────────────────────────────────────────────────────────────
  # JOB 2: Verificación de importaciones y sintaxis
  # ────────────────────────────────────────────────────────────────
  lint-sintaxis:
    name: 🔍 Verificación de Sintaxis
    runs-on: ubuntu-latest
    needs: test-motor-cst

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: 📦 Instalar dependencias
        run: |
          pip install -r requirements.txt

      - name: ✅ Verificar que el módulo importa correctamente
        run: |
          python -c "from src.models.contrato import ContratoLaboral; print('✅ ContratoLaboral OK')"
          python -c "from src.models.pago import ConceptoNomina; print('✅ ConceptoNomina OK')"
          python -c "from src.models.suspension import SuspensionContrato; print('✅ SuspensionContrato OK')"
          python -c "from src.engine.calculador import CalculadorEngine; print('✅ CalculadorEngine OK')"

      - name: 🔢 Verificar cálculo de caso de referencia
        run: |
          python -c "
          from datetime import datetime
          from src.models.contrato import ContratoLaboral
          from src.models.pago import ConceptoNomina
          from src.engine.calculador import CalculadorEngine

          c = ContratoLaboral(datetime(2023,1,1), datetime(2023,12,30), 'Término Indefinido', True)
          c.agregar_pago(ConceptoNomina('Salario', 1160000, True))
          e = CalculadorEngine(1160000, 140606)
          dias = c.calcular_dias_comerciales()
          assert dias == 360, f'Error: se esperaban 360 días, se obtuvieron {dias}'
          prima = e.liquidar_concepto_prestacional(c, dias, 'prima')
          assert prima['valor_liquidado'] > 0, 'Error: prima debe ser positiva'
          print(f'✅ Caso de referencia OK — Prima: \${prima[\"valor_liquidado\"]:,.2f}')
          "

  # ────────────────────────────────────────────────────────────────
  # JOB 3: Badge de estado en README (solo en push a main)
  # ────────────────────────────────────────────────────────────────
  notificar-estado:
    name: 📢 Estado del Pipeline
    runs-on: ubuntu-latest
    needs: [test-motor-cst, lint-sintaxis]
    if: always()

    steps:
      - name: ✅ Pipeline exitoso
        if: needs.test-motor-cst.result == 'success' && needs.lint-sintaxis.result == 'success'
        run: |
          echo "=================================================="
          echo "✅ PIPELINE COMPLETO — LiquidaYA está estable"
          echo "🧪 Tests: PASSED"
          echo "🔍 Sintaxis: OK"
          echo "🚀 Listo para deploy en Streamlit Cloud"
          echo "=================================================="

      - name: ❌ Pipeline con errores
        if: needs.test-motor-cst.result == 'failure' || needs.lint-sintaxis.result == 'failure'
        run: |
          echo "=================================================="
          echo "❌ PIPELINE FALLIDO — Revisar antes de hacer merge"
          echo "=================================================="
          exit 1